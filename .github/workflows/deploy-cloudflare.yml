# Builds the shop and deploys it to the Cloudflare Worker karihari-grand-cherokee-parts-hub.
# Needs one repository secret: CLOUDFLARE_API_TOKEN.
# Started by hand (Actions → Deploy to Cloudflare → Run workflow) until the API is live;
# then the push trigger below is enabled so every commit to main (including Lovable's) deploys.
name: Deploy to Cloudflare

on:
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: c82bb2dc25c1f5f5bcea52b65ae8dbf2
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_API_URL: https://gc-parts-api.gcparts-am.workers.dev/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Deploy
        run: npx --yes wrangler@4 deploy --name karihari-grand-cherokee-parts-hub
