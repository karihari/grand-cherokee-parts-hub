# Builds the shop and deploys it to the Cloudflare Worker karihari-grand-cherokee-parts-hub.
# Needs one repository secret: CLOUDFLARE_API_TOKEN.
# Runs on every push to main (including Lovable's commits) and can be started by hand
# (Actions → Deploy to Cloudflare → Run workflow).
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: c82bb2dc25c1f5f5bcea52b65ae8dbf2
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_API_URL: https://gc-parts-api.gcparts-am.workers.dev/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Server-side rendering calls the API Worker on the same workers.dev subdomain; Cloudflare
      # blocks that (404) unless fetch goes out over the public internet.
      - name: Allow calling the API Worker during SSR
        run: |
          node -e '
            const fs = require("fs");
            const file = ".output/server/wrangler.json";
            const cfg = JSON.parse(fs.readFileSync(file, "utf8"));
            const flags = new Set(cfg.compatibility_flags || []);
            flags.add("global_fetch_strictly_public");
            cfg.compatibility_flags = [...flags];
            fs.writeFileSync(file, JSON.stringify(cfg, null, 2));
            console.log("compatibility_flags:", cfg.compatibility_flags.join(", "));
          '
      - name: Deploy
        run: npx --yes wrangler@4 deploy --name karihari-grand-cherokee-parts-hub
